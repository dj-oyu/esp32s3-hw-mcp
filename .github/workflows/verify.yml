name: verify

# The point of this job is reproducibility: refetch the primary sources, rebuild every derived file from
# the PDFs, and require the result to be byte-identical to what is committed. A silent change in the
# extraction (or an Espressif re-release that changes a page) fails here instead of quietly serving
# wrong register or pipeline data.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install extractor dependencies
        run: pip install -r requirements.txt
      - name: Fetch primary sources (sha256-pinned)
        run: bash tools/fetch_sources.sh
      - name: Build corpora
        run: |
          python tools/build_corpus.py sources/esp32-s3_technical_reference_manual_en.pdf --out corpus/trm-s3
          python tools/build_corpus.py sources/esp32-s3_datasheet_en.pdf --out corpus/datasheet-s3
      - name: Extract PIE knowledge
        run: python tools/extract_pie.py
      - name: Extract register knowledge
        run: python tools/extract_registers.py
      - name: Verify PIE (coverage / syntax / stages / spot checks)
        run: python tools/verify_pie.py
      - name: Verify registers (coverage / shape / collisions / spot checks)
        run: python tools/verify_registers.py
      - name: "Check out the sibling project the fourth tier quotes (optional)"
        # data/pie_measured_costs.json quotes another project's measurement write-up by line, so the gate
        # below re-checks every quote and every number against that document when it is present, and reports
        # those checks as skipped when it is not (no network, private fork, revision moved). The checkout is
        # therefore allowed to fail without failing the job; the structural, provenance, link and
        # re-run-the-recorded-search checks run either way.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: dj-oyu/cardputer-adv-pocketjs
          path: cardputer-adv-pocketjs
      - name: "Verify measured costs (fourth tier: quotes, numbers, links, recorded searches)"
        env:
          ESP32S3_POCKETJS_DOC: ${{ github.workspace }}/cardputer-adv-pocketjs/docs/pie-simd.md
        run: python tools/verify_measured_costs.py
      - name: Generated firmware assembly is up to date
        run: python tools/gen_pie_timing_asm.py --check
      - name: Timing-log parser self-test
        run: python tools/selftest_pie_timing_parser.py
      - name: Examples-log checker self-test (reference log passes, every mutation is caught)
        run: python tools/selftest_examples_checker.py
      - name: Flash-dump gate self-test (accepts a good dump, rejects each kind of broken one)
        run: python tools/selftest_check_flash_dump.py
      - name: Manual-vs-assembler self-test (skips itself when no Espressif toolchain is installed)
        run: python tools/selftest_asm_toolchain.py
      - name: MCP server end-to-end test (stdio)
        run: python tools/test_mcp_server.py
      - name: Committed data must match a fresh extraction
        run: |
          if ! git diff --quiet -- data/ ; then
            echo "::error::data/ differs from a fresh extraction -- regenerate and commit"
            git diff --stat -- data/
            exit 1
          fi

  # The uvx route is a different install of the same knowledge, and it can lose a data file without failing
  # anything: every tool still starts, and answers from nothing. So the wheel is built here, checked against
  # the registry's own declaration (tools/check_wheel.py), installed into a clean environment, and put
  # through the same end-to-end suite as the checkout -- which is what a `uvx --from git+...` user runs.
  package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling and the test client
        run: pip install build mcp
      - name: Build the wheel
        run: python -m build --wheel
      - name: The wheel carries every artifact the registry says it ships
        run: python tools/check_wheel.py dist/*.whl
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/packaged
          /tmp/packaged/bin/pip install --quiet dist/*.whl
          /tmp/packaged/bin/esp32s3-hw-mcp --version
      - name: The installed copy answers from its own data, and its routes resolve
        run: |
          /tmp/packaged/bin/esp32s3-hw-mcp --paths
          /tmp/packaged/bin/esp32s3-hw-mcp --list
          /tmp/packaged/bin/esp32-hw-mcp --version   # the short alias resolves to the same server
      - name: The installed copy passes the same end-to-end suite
        env:
          ESP32S3_SERVER_CMD: /tmp/packaged/bin/esp32s3-hw-mcp
        run: python tools/test_mcp_server.py
